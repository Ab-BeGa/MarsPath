name: Gale DEM verification
on:
  push:
    branches:
      - feature/gale-route-planner
      - feature/gale-route-in-region-map
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exact Node dependencies
        run: npm ci
      - name: Run browser and real Gale DEM integration tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build
      - name: Verify bundled Gale DEM assets
        run: |
          test -s dist/data/gale/metadata.json
          test -s dist/data/gale/heights.f32
          test -s dist/data/gale/mask.u8
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python geospatial dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python ETL and scientific tests
        run: python -m unittest discover -s tests -v
