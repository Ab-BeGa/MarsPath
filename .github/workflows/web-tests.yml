name: Web map and route comparison

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Node.js 22 / TypeScript / production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependency versions
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: Validate production DEM assets
        run: |
          test -s dist/data/jezero/metadata.json
          test -s dist/data/jezero/heights.f32
          test -s dist/data/jezero/mask.u8
